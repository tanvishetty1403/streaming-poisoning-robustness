datasets:
  paysim: {sample_frac: 0.1, test_from_step: 600, window_steps: 24}
  ulb:    {sample_frac: 1.0, test_from_step: 36,  window_steps: 2}
learner:
  fraud_weight: 20.0
  threshold: 0.5
seeds: [0, 1, 2]
results_csv: results/metrics.csv
benchmark_csv: results/benchmark.csv

defense:
  detectors: [robust_z, label_loss, mahalanobis]   # which detectors run; the ensemble is the max of their normalised scores
  z_threshold: 5.0          # robust_z: suspicious above this many robust std devs
  loss_threshold: 4.0       # label_loss: suspicious above this (-log p of the given label)
  ref_window: 20000         # robust_z: accepted rows kept as the reference
  min_ref: 500              # robust_z: accepted rows needed before it judges against the reference
  class_conditional: true   # robust_z: compare a row with accepted rows of the SAME label (true fraud is not an outlier among fraud)
  min_ref_class: 30         # robust_z (class-conditional): accepted rows per class needed before that class is judged
  trusted_windows: 1        # first N windows are assumed clean: accepted unchecked, used only to build the references. Keep equal to attacks.clean_windows (attacks must not touch these windows)
  bootstrap_first_window: false  # robust_z (marginal mode, no trusted window): score the first window against its own median/MAD
  maha_quantile: 0.9999     # mahalanobis (optional detector, add to `detectors` to enable): a row is suspicious beyond this chi-square quantile
  maha_threshold: 3.0       # mahalanobis: scale on the normalised score; tuned on real PaySim (1.0 loses ~2% clean rows, 3.0 about 0.1%)
  maha_min_ref_class: 200   # mahalanobis: accepted rows per class needed before it judges
  label_window: 20000       # label_loss: accepted rows the reference model is fit on
  label_min_ref: 2000       # label_loss: accepted rows needed before it may judge
  min_class: 20             # label_loss: rows of EACH class needed before it may judge
  review_windows: null      # DEFAULT null = strict contract (every row in exactly one output). N = release/discard after N windows; breaks the contract, needs an amendment, off for all reported runs
  label_col: isFraud        # the (possibly poisoned) label column
  time_col: step            # event-time column
  features: null            # null = the dataset featurizer (same matrix as the learner: log amounts, balance-identity residuals, one-hot type). Explicit list = raw columns instead (loses the residuals).
  exclude: []               # extra columns to drop when no featurizer/list is used

attacks:
  label_col: isFraud
  time_col: step
  clean_windows: 1              # attacks skip the first N windows (defense trusts window 0)
  budgets: [0.01, 0.05, 0.10, 0.20]
  timings: [uniform, burst, low_and_slow]
  methods:                      # budget: random_flip = fraction of train rows, all others = fraction of fraud rows
    random_flip:   {type: random_label_flip}
    targeted_flip: {type: targeted_label_flip}
    feature_shift: {type: feature_poison, mode: shift, strength: 3.0, target_label: 1}
    feature_scale: {type: feature_poison, mode: scale, strength: 5.0, target_label: 1}
    feature_noise: {type: feature_poison, mode: noise, strength: 2.0, target_label: 1}
    backdoor:      {type: backdoor}
  features:                     # numeric columns only; check against P1's loader
    paysim: [amount, oldbalanceOrg, newbalanceOrig, oldbalanceDest, newbalanceDest]
    ulb: [V1, V2, V3, V4, V5, V6, V7, V8, V9, V10, V11, V12, V13, V14, V15, V16, V17, V18, V19, V20, V21, V22, V23, V24, V25, V26, V27, V28, Amount]
  trigger:                      # backdoor pattern, stamped on poisoned fraud rows (labelled legit); tune so it is rare
    paysim: {amount: 9999.99, oldbalanceOrg: 9999.99}
    ulb: {V1: -6.0, V2: 6.0}