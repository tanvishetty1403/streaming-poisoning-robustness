# Append to config/default.yaml
attacks:
  label_col: isFraud
  time_col: step
  budgets: [0.01, 0.05, 0.10, 0.20]
  timings: [uniform]            # add burst, low_and_slow in Phase 3
  methods:
    random_flip:   {type: random_label_flip}
    targeted_flip: {type: targeted_label_flip}
    feature_shift: {type: feature_poison, mode: shift, strength: 3.0}
    feature_scale: {type: feature_poison, mode: scale, strength: 5.0}
    feature_noise: {type: feature_poison, mode: noise, strength: 2.0}
  features:                     # numeric columns only; check against P1's loader
    paysim: [amount, oldbalanceOrg, newbalanceOrig, oldbalanceDest, newbalanceDest]
    ulb: [V1, V2, V3, V4, V5, V6, V7, V8, V9, V10, V11, V12, V13, V14, V15, V16, V17, V18, V19, V20, V21, V22, V23, V24, V25, V26, V27, V28, Amount]
